server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend peer lazily (per request) instead of at worker start,
    # so nginx can boot and serve static assets even when backend is absent
    # (e.g. standalone CD smoke `GET /`). DNS host below = Docker embedded DNS.
    # AI HERE: hardcoded to bridge/compose resolver; if a k8s Deployment needs
    # deferred /api proxying, override `resolver` to the kube-dns cluster IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location ~ /\. { deny all; }

    location /api/ {
        # Variable proxy_pass strips the /api prefix so /api/interviews -> backend:8000/interviews.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE streaming requires buffering off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform" always;
    }
}
