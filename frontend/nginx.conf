server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects must stay relative: nginx's default absolute form expands to the listen port
    # (:8080), not the public origin it sits behind (the ingress/Cloudflare tunnel).
    absolute_redirect off;

    # Resolve the backend peer lazily (per request) instead of at worker start,
    # so nginx can boot and serve static assets even when backend is absent
    # (e.g. standalone CD smoke `GET /`). DNS host below = Docker embedded DNS.
    # AI HERE: compose-only hop — prod routes /api at the ingress straight to the backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location ~ /\. { deny all; }

    # The SPA carries real text assets (485 kB of JS before compression) and nothing upstream is
    # guaranteed to compress them: the stock nginx image ships gzip OFF. SSE is deliberately not
    # in gzip_types (text/event-stream must stay unbuffered and uncompressed for streaming).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json;

    location /api/ {
        # Path passes through unchanged: the backend serves its routes under /api itself.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE streaming requires buffering off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Vite content-hashes everything under /assets, so a URL can never change meaning: cache it
    # for a year. `^~` keeps the static-asset regex below from downgrading it to a short TTL.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The HTML shell must never be cached: every deploy renames the hashed assets it references,
    # so a stale document points at files that no longer exist (blank page).
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Browsers request /favicon.ico unprompted; the SVG is the only icon we ship.
    location = /favicon.ico {
        return 301 /favicon.svg;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Other static files (icons, og images, webmanifest) are not content-hashed: short TTL.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform" always;
    }
}
