# The liveness and readiness probes fetch `/` every 10s, and their access lines were 97% of every byte
# this app's pod ever wrote to Loki (17,283 of 17,756 lines in a day). Dropped at the source, the same
# way the backend skips /api/health: the line never leaves the node.
map $http_user_agent $probe_noise {
    ~kube-probe 0;
    default 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same path and format as nginx.conf inherits: the image symlinks this to /dev/stdout.
    access_log /var/log/nginx/access.log main if=$probe_noise;

    # Redirects must stay relative: nginx's default absolute form expands to the listen port
    # (:8080), not the public origin it sits behind (the ingress/Cloudflare tunnel).
    absolute_redirect off;

    # Resolve the backend peer lazily (per request) instead of at worker start,
    # so nginx can boot and serve static assets even when backend is absent
    # (e.g. standalone CD smoke `GET /`). DNS host below = Docker embedded DNS.
    # AI HERE: compose-only hop: prod routes /api at the ingress straight to the backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location ~ /\. { deny all; }

    # The SPA carries real text assets (485 kB of JS before compression) and nothing upstream is
    # guaranteed to compress them: the stock nginx image ships gzip OFF. SSE is deliberately not
    # in gzip_types (text/event-stream must stay unbuffered and uncompressed for streaming).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json;

    location /api/ {
        # Path passes through unchanged: the backend serves its routes under /api itself.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Resume import posts a PDF, capped at 2MB in app/resumes.py. nginx's default body limit is 1m,
        # so without this a normal CV is a 413 the app never even sees. Prod routes /api straight at
        # the backend, so the ingress needs the matching annotation (see PLAN guardrails).
        client_max_body_size 3m;

        # SSE streaming requires buffering off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Vite content-hashes everything under /assets, so a URL can never change meaning: cache it
    # for a year. `^~` keeps the static-asset regex below from downgrading it to a short TTL.
    # No `always` on the header, deliberately: it must not decorate a 404, or an edge cache
    # (Cloudflare respects origin Cache-Control on .js) pins a missing chunk for a year: one
    # deploy-race 404 and the visitor's shell is permanently broken.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML shell must never be cached: every deploy renames the hashed assets it references,
    # so a stale document points at files that no longer exist (blank page).
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Browsers request /favicon.ico unprompted; the SVG is the only icon we ship.
    location = /favicon.ico {
        return 301 /favicon.svg;
    }

    location / {
        # Real files, else a real 404 whose body is the SPA shell: error_page keeps the 404
        # status, so the router's catch-all renders the styled NotFound page without lying to
        # crawlers. The previous blanket `/index.html` fallback made every typo URL a soft 404.
        try_files $uri $uri/ =404;
        error_page 404 /index.html;
    }

    # Client-side routes with no file behind them: every gated app page and interview deep
    # links. These must answer 200 or the browser still hydrates but the URL reads as broken.
    # The noindex header is belt-and-braces only: robots.txt Disallows the same prefixes, so a
    # compliant crawler never gets far enough to read it. It covers fetchers that ignore
    # robots.txt, and it is what would take effect if the Disallow were ever lifted. Keep this
    # regex in sync with frontend/public/robots.txt.
    location ~ ^/(?:dashboard|resume|interviews|analytics|settings|manage)(?:/|$) {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # Other static files (icons, og images, webmanifest) are not content-hashed: short TTL.
    # No `always` on the add_header, for the same reason as the /assets block above: a missing
    # file's 404 must not advertise itself as cacheable. (`expires` is status-gated by nginx; a
    # blanket add_header is not.)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
