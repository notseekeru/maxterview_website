<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Title/description must lead with the query, not the brand: this shell is the only
             HTML a non-JS crawler (Google's render is not guaranteed for every bot, and Bing,
             social unfurlers and every AI answer engine run no JS at all) will ever see.
             Keep the default title in sync with TAGLINE in src/hooks/useDocumentTitle.ts — the
             hook overwrites this one as soon as React mounts. -->
        <title>AI Mock Interview Practice with Instant Feedback | maxterview</title>
        <meta name="description" content="Run AI mock interview practice for your role: behavioral and technical questions, every answer graded, a hire or reject verdict and fixes. Free, no card." />
        <meta name="robots" content="index, follow, max-image-preview:large" />
        <!-- theme-color tracks the default theme (dark); explicit light users live with a dark
             browser chrome rather than the OS-conditioned pair guessing wrong either way. -->
        <meta name="theme-color" content="#0a0a0a" />
        <link rel="canonical" href="https://maxterview.seekeru.tech/" />
        <link rel="icon" href="/M-Inverted.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/M-Inverted.svg" />
        <!-- Social card. og.png is a committed 1200x630 asset and the URLs are absolute on
             purpose: unfurlers fetch with no document base and will not resolve a relative one. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="maxterview" />
        <meta property="og:title" content="AI Mock Interview Practice with Instant Feedback" />
        <meta property="og:description" content="Answer behavioral and technical questions one at a time. Every answer is graded, every run ends in a hire or reject verdict, and your accuracy trends over time." />
        <meta property="og:url" content="https://maxterview.seekeru.tech/" />
        <meta property="og:image" content="https://maxterview.seekeru.tech/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="maxterview: practice interviews with an AI coach that gives real feedback" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://maxterview.seekeru.tech/og.png" />
        <!-- Structured data, static so it needs no JS. FAQPage is deliberately absent: the FAQ
             text is React-rendered, so the markup would describe content a non-JS crawler cannot
             see. Add it when the FAQ ships as static HTML. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "Organization",
                        "@id": "https://maxterview.seekeru.tech/#organization",
                        "name": "maxterview",
                        "url": "https://maxterview.seekeru.tech/"
                    },
                    {
                        "@type": "WebSite",
                        "@id": "https://maxterview.seekeru.tech/#website",
                        "name": "maxterview",
                        "url": "https://maxterview.seekeru.tech/",
                        "publisher": { "@id": "https://maxterview.seekeru.tech/#organization" }
                    },
                    {
                        "@type": "SoftwareApplication",
                        "name": "maxterview",
                        "applicationCategory": "BusinessApplication",
                        "operatingSystem": "Web",
                        "url": "https://maxterview.seekeru.tech/",
                        "description": "AI mock-interview coach: practice behavioral and technical questions one at a time, get every answer graded, a hire or reject verdict and an accuracy trend.",
                        "offers": [
                            { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "PHP" },
                            {
                                "@type": "Offer",
                                "name": "Pro",
                                "price": "99",
                                "priceCurrency": "PHP",
                                "priceSpecification": {
                                    "@type": "UnitPriceSpecification",
                                    "price": "99",
                                    "priceCurrency": "PHP",
                                    "billingDuration": { "@type": "QuantitativeValue", "value": 30, "unitCode": "DAY" }
                                }
                            }
                        ]
                    }
                ]
            }
        </script>
        <!-- Boot-time theme: read the stored choice before first paint so a dark
             preference survives page loads landing anywhere in the app (the value is
             otherwise only re-applied once React mounts the settings page). Must stay
             in sync with frontend/src/lib/theme.ts (incl. the maxterview.theme key and
             the dark default). -->
        <script>
            (() => {
                try {
                    const raw = localStorage.getItem("maxterview.theme");
                    const theme = (raw === "light" || raw === "dark" || raw === "system") ? raw : "dark";
                    const dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    document.documentElement.classList.toggle("dark", dark);
                } catch (_e) {
                    /* localStorage unavailable (private mode) — default dark. */
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
