<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>maxterview — AI mock-interview coach</title>
        <meta name="description" content="Practice job interviews with an AI coach: one question at a time, then per-dimension scores, a hire/reject verdict and tips. Free to start." />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
        <link rel="canonical" href="https://maxterview.seekeru.tech/" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/favicon.svg" />
        <!-- Open Graph / Twitter: no image asset ships yet, so the card degrades to title +
             description rather than pointing at a 404. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="maxterview" />
        <meta property="og:title" content="maxterview — AI mock-interview coach" />
        <meta property="og:description" content="Practice interviews with an AI coach that scores every answer and tracks what you improve." />
        <meta property="og:url" content="https://maxterview.seekeru.tech/" />
        <meta name="twitter:card" content="summary" />
        <!-- Boot-time theme: read the stored choice before first paint so a dark
             preference survives page loads landing anywhere in the app (the value is
             otherwise only re-applied once React mounts the settings page). Must stay
             in sync with frontend/src/lib/theme.ts (incl. the maxterview.theme key). -->
        <script>
            (() => {
                try {
                    const raw = localStorage.getItem("maxterview.theme");
                    const theme = (raw === "light" || raw === "dark" || raw === "system") ? raw : "system";
                    const dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    document.documentElement.classList.toggle("dark", dark);
                } catch (_e) {
                    /* localStorage unavailable (private mode) — default light. */
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
