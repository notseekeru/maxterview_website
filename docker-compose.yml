# Declarative topology: every service, network, volume and healthcheck is
# declared here. Nothing is configured imperatively at runtime.
name: maxterview

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxterview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxterview}
      POSTGRES_DB: ${POSTGRES_DB:-maxterview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxterview} -d ${POSTGRES_DB:-maxterview}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Internal network: NOT reachable from the host or the frontend,
    # only from the backend. This is a hard isolation boundary.
    networks:
      - db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maxterview}:${POSTGRES_PASSWORD:-maxterview}@postgres:5432/${POSTGRES_DB:-maxterview}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - db
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - backend
    restart: unless-stopped

# Isolated network segments.
networks:
  # Private DB segment, internal only (no host ingress).
  db:
    internal: true
  # Public segment shared by backend + frontend.
  backend:

volumes:
  postgres_data:
