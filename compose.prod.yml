# Export DATABASE_URL to rehearse against Neon; the local container is the default.
services:
  backend:
    container_name: maxterview_backend_prod
    build:
      context: ./backend-ts
      target: prod
    env_file:
      - .env
      - ./backend-ts/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-maxterview}:${POSTGRES_PASSWORD:-maxterview}@postgres:5432/${POSTGRES_DB:-maxterview}}
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - db
      - backend
    restart: unless-stopped

  frontend:
    container_name: maxterview_frontend_prod
    build:
      context: ./frontend
      target: prod
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
