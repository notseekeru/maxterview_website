# Prod-shape rehearsal only — real prod is k3s + external Neon, no DB pod (PLAN.md 3b).
# Export DATABASE_URL to rehearse against Neon; the local container is the default.
services:
  backend:
    container_name: maxterview_backend_prod
    build:
      context: ./backend
      target: prod
    env_file:
      - .env
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-maxterview}:${POSTGRES_PASSWORD:-maxterview}@postgres:5432/${POSTGRES_DB:-maxterview}}
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - db
      - backend
    restart: unless-stopped

  frontend:
    container_name: maxterview_frontend_prod
    build:
      context: ./frontend
      target: prod
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
