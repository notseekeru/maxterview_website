# Shared services/network/volume definitions. Dev and prod overlays
# (compose.dev.yml / compose.prod.yml) add build targets, ports and mounts.
name: maxterview

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxterview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxterview}
      POSTGRES_DB: ${POSTGRES_DB:-maxterview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxterview} -d ${POSTGRES_DB:-maxterview}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Internal network: NOT reachable from the host or the frontend — only
    # from the backend (plus migrate/psql helpers in the dev overlay).
    networks:
      - db
    restart: unless-stopped

networks:
  # Private DB segment, internal only (no host ingress).
  db:
    internal: true
  # Public segment shared by backend + frontend.
  backend:

volumes:
  postgres_data:
