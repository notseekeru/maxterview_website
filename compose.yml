name: maxterview

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: maxterview_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxterview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxterview}
      POSTGRES_DB: ${POSTGRES_DB:-maxterview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxterview} -d ${POSTGRES_DB:-maxterview}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    internal: true
  backend:

volumes:
  postgres_data:
