name: maxterview

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    container_name: maxterview_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maxterview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxterview}
      POSTGRES_DB: ${POSTGRES_DB:-maxterview}
    volumes:
      # PG18+ images store data in a versioned subdir; mount the parent dir.
      # See https://github.com/docker-library/postgres/pull/1259
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxterview} -d ${POSTGRES_DB:-maxterview}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    internal: true
  backend:

volumes:
  postgres_data:
