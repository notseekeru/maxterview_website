[project]
name = "maxterview-backend"
version = "0.1.0"
description = "AI mock-interview coach backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "asyncpg>=0.31",
    "psycopg2-binary>=2.9",
    "structlog>=24.1",
    "PyJWT>=2.14.0",
    "cryptography>=43.0",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "yoyo-migrations>=8.3",
    "limits>=5",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
]

[tool.uv]
override-dependencies = [
    "sqlparse>=0.6.0",
]

[tool.ruff]
line-length = 320

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
