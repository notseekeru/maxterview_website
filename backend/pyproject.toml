[project]
name = "maxterview-backend"
version = "0.1.0"
description = "AI mock-interview coach backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "asyncpg>=0.31",
    "structlog>=24.1",
    "PyJWT>=2.9",
    "cryptography>=43.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
]

[tool.ruff]
line-length = 320

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
