# Dev overlay: hot-reload backend, Vite dev server, psql helper.
#   docker compose -p maxterview-dev -f compose.yml -f compose.dev.yml up
services:
  backend:
    container_name: maxterview_backend_dev
    build:
      context: ./backend
      target: dev
    user: root
    env_file:
      - .env
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maxterview}:${POSTGRES_PASSWORD:-maxterview}@postgres:5432/${POSTGRES_DB:-maxterview}
      APP_ENV: ${APP_ENV:-development}
      PYTHONPYCACHEPREFIX: /tmp/pycache
      RUFF_CACHE_DIR: /tmp/ruff
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
      - backend

  frontend:
    container_name: maxterview_frontend_dev
    build:
      context: ./frontend
      target: dev
    environment:
      - VITE_API_BASE=/api
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - backend

  psql:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: maxterview_psql_dev
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-maxterview}
    entrypoint: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-maxterview}", "-d", "${POSTGRES_DB:-maxterview}"]
    networks:
      - db
