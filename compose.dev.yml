# Dev overlay: hot-reload backend, Vite dev server, psql helper.
#   docker compose -p maxterview-dev -f compose.yml -f compose.dev.yml up
services:
  backend:
    build:
      context: ./backend
      target: dev
    # Root in dev: image venv is masked by the anonymous /app/.venv volume, so
    # the non-root appuser can't re-sync dev deps into it (Permission denied).
    user: root
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maxterview}:${POSTGRES_PASSWORD:-maxterview}@postgres:5432/${POSTGRES_DB:-maxterview}
      APP_ENV: development
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
      - backend

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      - VITE_API_BASE=/api
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - backend

  psql:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-maxterview}
    entrypoint: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-maxterview}", "-d", "${POSTGRES_DB:-maxterview}"]
    networks:
      - db
