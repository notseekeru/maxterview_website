name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"
      - ".gitleaksignore"
      - "compose.yml"
      - "compose.dev.yml"
      - "compose.prod.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    services:
      postgres:
        image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        env:
          POSTGRES_USER: maxterview
          POSTGRES_PASSWORD: maxterview
          POSTGRES_DB: maxterview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxterview -d maxterview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maxterview:maxterview@localhost:5432/maxterview
      APP_ENV: test
      CLERK_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        if: matrix.service == 'frontend'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        if: matrix.service == 'frontend'
        run: npm ci

      - name: Lint (frontend)
        if: matrix.service == 'frontend'
        run: npm run lint

      - name: Format gate
        if: matrix.service == 'frontend'
        run: git diff --exit-code

      - name: Typecheck (frontend)
        if: matrix.service == 'frontend'
        run: npm run typecheck

      - name: Build (frontend)
        if: matrix.service == 'frontend'
        run: npm run build

      - name: Audit (frontend)
        if: matrix.service == 'frontend'
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        env:
          POSTGRES_USER: maxterview
          POSTGRES_PASSWORD: maxterview
          POSTGRES_DB: maxterview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxterview -d maxterview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maxterview:maxterview@localhost:5432/maxterview
      APP_ENV: test
      CLERK_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (backend)
        run: npm run lint

      - name: Format gate
        run: git diff --exit-code

      - name: Typecheck (backend)
        run: npm run typecheck

      - name: Build (backend)
        run: npm run build

      - name: Test (backend)
        run: npx vitest run

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan the container definitions
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy:0.76.2 config \
            --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs node_modules --skip-dirs .git --skip-dirs .venv \
            /src

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan the history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --redact --no-banner
