name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"
      - "!frontend/**/.env.example"
      - "!backend/**/.env.example"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: maxterview
          POSTGRES_PASSWORD: maxterview
          POSTGRES_DB: maxterview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxterview -d maxterview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://maxterview:maxterview@localhost:5432/maxterview
      APP_ENV: test
      CLERK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest -q

      - name: Scan with Trivy (filesystem)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/backend:/workspace \
            -v ${{ github.workspace }}/backend/.trivyignore.yaml:/.trivyignore.yaml \
            aquasec/trivy:0.74.0 filesystem \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore.yaml \
            /workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx biome check .

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit (informational)
        run: npm audit --audit-level=moderate || true

