name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image_suffix: maxterview_backend
            port: 8000
            health_endpoint: /api/health
            # Scan shipped python runtime (app/.venv holds transitive wheels).
            # Keep only build-time noise filters.
            skip_dirs: "root/.cache,usr/local"
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_suffix: maxterview_frontend
            port: 8080
            health_endpoint: /
            # Nginx image has no venv; skip set is moot-noise only.
            skip_dirs: "root/.cache,app/.venv,usr/local"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image names
        run: |
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${{ matrix.service.image_suffix }}"
          IMAGE_TAG="${IMAGE}:${{ github.sha }}"
          {
            echo "IMAGE=${IMAGE}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "PUSH_TAGS<<EOF"
            echo "${IMAGE_TAG}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for smoke test (single-arch, load into daemon)
      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: prod
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          no-cache-filters: prod
          cache-from: type=gha,scope=${{ matrix.service.name }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-amd64

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ matrix.service.context }}/.trivyignore.yaml:/.trivyignore.yaml \
            aquasec/trivy:0.74.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs "${{ matrix.service.skip_dirs }}" \
            --ignorefile /.trivyignore.yaml \
            ${{ env.IMAGE_TAG }}

      - name: Run smoke container
        run: |
          cat > /tmp/smoke-env-${{ matrix.service.name }}.env << EOF
          APP_ENV=development
          CLERK_ENABLED=false
          DATABASE_URL=postgresql+asyncpg://x:x@localhost:5432/x
          EOF
          docker run -d --name smoke-${{ matrix.service.name }}-${{ github.run_id }} \
            -p 127.0.0.1:${{ matrix.service.port }}:${{ matrix.service.port }} \
            --env-file /tmp/smoke-env-${{ matrix.service.name }}.env \
            ${{ env.IMAGE_TAG }}

      - name: Wait for service
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:${{ matrix.service.port }}${{ matrix.service.health_endpoint }} >/dev/null; then
              echo "${{ matrix.service.name }} is up"; exit 0
            fi
            sleep 1
          done
          echo "${{ matrix.service.name }} did not respond"
          docker logs smoke-${{ matrix.service.name }}-${{ github.run_id }} || true
          exit 1

      - name: Smoke test
        run: curl -fsS http://127.0.0.1:${{ matrix.service.port }}${{ matrix.service.health_endpoint }} >/dev/null

      - name: Push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.PUSH_TAGS }}
          no-cache-filters: prod
          # A dedicated export scope: the amd64 build above writes its own, so neither one clobbers
          # the other's per-platform records. Shared, the arm64 leg lost every time and paid the full
          # emulated texlive install on each push.
          cache-from: |
            type=gha,scope=${{ matrix.service.name }}-amd64
            type=gha,scope=${{ matrix.service.name }}-multiarch
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-multiarch

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smoke-${{ matrix.service.name }}-${{ github.run_id }} || true

  update-gitops-repo:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.MAXTERVIEW_SSH }}
          known_hosts: "unnecessary"

      - name: Add GitHub to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone GitOps Repository
        run: |
          git clone git@github.com:notseekeru/gitops.git \
            || { GIT_SSH_COMMAND="ssh -vv" git ls-remote git@github.com:notseekeru/gitops.git 2>&1 | tail -30; exit 1; }

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update Image Tags
        run: |
          SHA=${{ github.sha }}
          BE=ghcr.io/notseekeru/maxterview_backend
          FE=ghcr.io/notseekeru/maxterview_frontend
          cd gitops/apps/maxterview/overlays/prod
          kustomize edit set image "$BE=$BE:$SHA"
          kustomize edit set image "$FE=$FE:$SHA"

      - name: Commit and Push Changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/maxterview/overlays
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping deployment commit."
          else
            git commit -m "chore(gitops): deploy maxterview images ${{ github.sha }}"
            git push origin main
          fi
